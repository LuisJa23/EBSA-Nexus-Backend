# Test profile using H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# JWT test config
jwt.secret=test-secret-key-which-is-long-enough-1234567890
jwt.expiration=3600000
jwt.issuer=ebsa-nexus-backend

# Web server disabled during tests
server.port=0

logging.level.org.springframework.security=INFO
