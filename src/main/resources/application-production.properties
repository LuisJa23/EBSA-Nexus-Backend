# ===========================================# ===========================================

# PRODUCTION PROFILE - RENDER + AIVEN# PRODUCTION PROFILE - RENDER + AIVEN

# Optimized for cloud deployment# Optimized for cloud deployment

# ===========================================# ===========================================

spring.application.name=ebsa_nexusspring.application.name=ebsa_nexus



# Render inyecta PORT automáticamente, usar 8080 como fallback# Render inyecta PORT automáticamente, usar 8080 como fallback

server.port=${PORT:8080}server.port=${PORT:8080}



# ===========================================# ===========================================

# AIVEN DATABASE CONFIGURATION# AIVEN DATABASE CONFIGURATION

# IMPORTANT: Configure these in Render Dashboard# ===========================================

# ===========================================# IMPORTANTE: Configurar DATABASE_URL, DATABASE_USERNAME y DATABASE_PASSWORD en Render

spring.datasource.url=${DATABASE_URL}spring.datasource.url=${DATABASE_URL}

spring.datasource.username=${DATABASE_USERNAME}spring.datasource.username=${DATABASE_USERNAME}

spring.datasource.password=${DATABASE_PASSWORD}spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driverspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# Connection pool settings for cloud# Connection pool settings for cloud

spring.datasource.hikari.maximum-pool-size=10spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000spring.datasource.hikari.max-lifetime=1800000

spring.datasource.hikari.leak-detection-threshold=60000spring.datasource.hikari.leak-detection-threshold=60000



# ===========================================# ===========================================

# JPA/HIBERNATE - PRODUCTION# JPA/HIBERNATE - PRODUCTION

# ===========================================# ===========================================

spring.jpa.hibernate.ddl-auto=validatespring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=falsespring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=falsespring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialectspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.properties.hibernate.jdbc.batch_size=20spring.jpa.properties.hibernate.jdbc.batch_size=20

spring.jpa.properties.hibernate.order_inserts=truespring.jpa.properties.hibernate.order_inserts=true

spring.jpa.properties.hibernate.order_updates=truespring.jpa.properties.hibernate.order_updates=true



# Deshabilitar inicialización de datos (ya están en la BD)# Deshabilitar inicialización de datos (ya están en la BD)

spring.sql.init.mode=neverspring.sql.init.mode=never

spring.jpa.defer-datasource-initialization=falsespring.jpa.defer-datasource-initialization=false



# ===========================================# ===========================================

# JWT CONFIGURATION# JWT CONFIGURATION

# ===========================================# ===========================================

jwt.secret=${JWT_SECRET}jwt.secret=${JWT_SECRET:ebsa-nexus-super-secret-key-change-in-production-2024}

jwt.expiration=${JWT_EXPIRATION:86400000}jwt.expiration=${JWT_EXPIRATION:86400000}

jwt.issuer=${JWT_ISSUER:ebsa-nexus-backend}jwt.issuer=${JWT_ISSUER:ebsa-nexus-backend}



# ===========================================# ===========================================

# SPRING CONFIGURATION# SPRING CONFIGURATION

# ===========================================# ===========================================

spring.main.allow-circular-references=truespring.main.allow-circular-references=true

spring.main.lazy-initialization=falsespring.main.lazy-initialization=false



# ===========================================# ===========================================

# ACTUATOR - PRODUCTION# ACTUATOR - PRODUCTION

# ===========================================# ===========================================

management.endpoints.web.exposure.include=health,info,metricsmanagement.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=alwaysmanagement.endpoint.health.show-details=always

management.endpoint.health.probes.enabled=truemanagement.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=truemanagement.health.livenessstate.enabled=true

management.health.readinessstate.enabled=truemanagement.health.readinessstate.enabled=true



# ===========================================# ===========================================

# FIREBASE STORAGE CONFIGURATION# FIREBASE STORAGE CONFIGURATION

# ===========================================# ===========================================

firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:/etc/secrets/firebase-service-account.json}firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:/etc/secrets/firebase-service-account.json}

firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET}firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:ebsa-nexus.firebasestorage.app}

firebase.storage.max-file-size=${FIREBASE_STORAGE_MAX_FILE_SIZE:26214400}firebase.storage.max-file-size=${FIREBASE_STORAGE_MAX_FILE_SIZE:26214400}

firebase.storage.max-files=${FIREBASE_STORAGE_MAX_FILES:10}firebase.storage.max-files=${FIREBASE_STORAGE_MAX_FILES:10}

firebase.storage.allowed-types=${FIREBASE_STORAGE_ALLOWED_TYPES:image/jpeg,image/png,image/jpg,image/webp}firebase.storage.allowed-types=${FIREBASE_STORAGE_ALLOWED_TYPES:image/jpeg,image/png,image/jpg,image/webp}



# ===========================================# ===========================================

# MULTIPART FILE UPLOAD CONFIGURATION# MULTIPART FILE UPLOAD CONFIGURATION

# ===========================================# ===========================================

spring.servlet.multipart.enabled=truespring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=25MBspring.servlet.multipart.max-file-size=25MB

spring.servlet.multipart.max-request-size=250MBspring.servlet.multipart.max-request-size=250MB



# ===========================================# ===========================================

# LOGGING - PRODUCTION# LOGGING - PRODUCTION

# ===========================================# ===========================================

logging.level.root=INFOlogging.level.root=INFO

logging.level.co.com.ebsa=INFOlogging.level.co.com.ebsa=INFO

logging.level.org.springframework.web=INFOlogging.level.org.springframework.web=INFO

logging.level.org.springframework.security=INFOlogging.level.org.springframework.security=INFO

logging.level.org.hibernate=WARNlogging.level.org.hibernate=WARN

logging.level.org.hibernate.SQL=WARNlogging.level.org.hibernate.SQL=WARN



# Log pattern for better debugging# Log pattern for better debugging

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%nlogging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================================

# SERVER CONFIGURATION# ===========================================

# ===========================================# SERVER CONFIGURATION

server.compression.enabled=true# ===========================================

server.http2.enabled=trueserver.compression.enabled=true

server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Graceful shutdownserver.http2.enabled=true

server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=30s# Graceful shutdown

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
