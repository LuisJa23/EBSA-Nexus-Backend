# ===========================================
# APLICACIÓN
# ===========================================
spring.application.name=ebsa_nexus
server.port=${SERVER_PORT:8080}

# ===========================================
# BASE DE DATOS
# ===========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===========================================
# JPA/HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt.secret=${JWT_SECRET:mySecretKey}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:ebsa-nexus-backend}

# ===========================================
# SPRING CONFIGURATION
# ===========================================
spring.main.allow-circular-references=true

# ===========================================
# ACTUATOR (para health checks)
# ===========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ===========================================
# FIREBASE STORAGE CONFIGURATION
# ===========================================
# Local development: uses classpath resource
# Production (Render): uses absolute path from Secret Files
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:ebsa-nexus.firebasestorage.app}
firebase.storage.max-file-size=${FIREBASE_STORAGE_MAX_FILE_SIZE:26214400}
firebase.storage.max-files=${FIREBASE_STORAGE_MAX_FILES:10}
firebase.storage.allowed-types=${FIREBASE_STORAGE_ALLOWED_TYPES:image/jpeg,image/png,image/jpg,image/webp}

# ===========================================
# MULTIPART FILE UPLOAD CONFIGURATION
# ===========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=250MB
